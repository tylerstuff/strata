name: Runtime checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install the pinned Rust toolchain and WASM target
        run: rustup show
      - run: npm ci
      - name: Validate optional authoring package and packed CLI consumer
        run: npm run check:authoring
      - run: npm run typecheck
      - run: npm run test:rust
      - run: npm run test:unit
      - run: npm run test:benchmark-server
      - run: npm run test:gallery:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install the virtual display and software Vulkan runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libvulkan1 mesa-vulkan-drivers
      - name: Test packed HTML and Vite consumers
        run: xvfb-run -a -s '-screen 0 1280x720x24' npm run test:consumers
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'
      - name: Validate authored scenes, large-coordinate precision, and scene receipts
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run test:authored-boxes
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'
      - name: Validate the procedural benchmark on software WebGPU
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run benchmark:smoke
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'
      - name: Validate raster shaders, temporal rejection, and resource transitions
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run test:raster
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'
      - name: Validate raster benchmark reports
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run benchmark:smoke -- --renderer raster
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'
      - name: Validate generated geometry coverage, streaming, and resource transitions
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run test:geometry
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'
      - name: Validate world-space tracing, probe cache, and rendered GI
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run test:gi
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'
      - name: Validate finite probe sampling volume
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run test:probe-volume
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'
      - name: Validate GI benchmark reports
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run benchmark:smoke -- --renderer gi
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'
      - name: Validate bounded diffuse refresh during continuous object motion
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run test:gi-motion
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'
      - name: Validate selected reflections, offscreen objects, and history rejection
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run test:reflections
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'
      - name: Validate reflection benchmark reports
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run benchmark:smoke -- --renderer reflections
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'
      - name: Save consumer test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-test-results
          path: test-results/consumers/
          if-no-files-found: ignore

  integrated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install the pinned Rust toolchain and WASM target
        run: rustup show
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install the virtual display and software Vulkan runtime
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libvulkan1 mesa-vulkan-drivers
      - name: Validate the local gallery with generated animated fixtures
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run test:gallery
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'
      - name: Validate integrated streaming, offscreen lighting, and lifecycle
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run test:integrated
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'
      - name: Validate generated imported materials, skinning, and lifecycle
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run test:imported
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'
      - name: Validate generated progressive transport and public engine integration
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run test:imported-indirect
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'
      - name: Validate integrated benchmark reports through empty reflection trace regions
        run: xvfb-run -a -s '-screen 0 1920x1200x24' npm run benchmark:smoke -- --renderer integrated --generated-fixture --duration 12
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
          STRATA_TEST_HEADED: '1'

  runtime:
    if: ${{ always() }}
    needs: [validation, integrated]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful validation lanes
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          INTEGRATED_RESULT: ${{ needs.integrated.result }}
        run: |
          test "$VALIDATION_RESULT" = success
          test "$INTEGRATED_RESULT" = success
