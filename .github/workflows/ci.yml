name: Runtime checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Install the pinned Rust toolchain and WASM target
        run: rustup show
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:rust
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Test packed HTML and Vite consumers
        run: npm run test:consumers
        env:
          STRATA_TEST_SOFTWARE_GPU: '1'
      - name: Save consumer test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: consumer-test-results
          path: test-results/
          if-no-files-found: ignore
