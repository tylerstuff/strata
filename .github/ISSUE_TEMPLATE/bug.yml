name: Bug report
description: Report a reproducible runtime, rendering, packaging, or editor problem.
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include a minimal example, steps, and relevant errors.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include commit/package version, OS, browser, GPU, and render resolution where relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Attach screenshots, timings, or a comparison with a known working version.
